AWSTemplateFormatVersion: '2010-09-09'
Description: Minimal AWS Batch (EC2 Spot) for Nextflow tests with instance profile
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  InstanceTypesCsv:
    Type: String
    Default: "m6i.large,c6i.large,t3.large"
    Description: Comma-separated list of instance types
Resources:
  BatchCE:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      ComputeEnvironmentName: nfcore-scrna-ce
      ServiceRole: !Ref AWS::NoValue  # use service-linked role (auto)
      ComputeResources:
        Type: SPOT
        AllocationStrategy: SPOT_CAPACITY_OPTIMIZED
        MinvCpus: 0
        DesiredvCpus: 0
        MaxvCpus: 32
        InstanceTypes: [ m6i.xlarge, m6i.2xlarge, m6i.large ]
        Subnets: !Ref SubnetIds
        SecurityGroupIds: [ !Ref SecurityGroupId ]
        InstanceRole: ecsInstanceRole
        Ec2KeyPair: !Ref AWS::NoValue
      State: ENABLED
  BatchQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: nfcore-scrna-queue
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref BatchCE
Outputs:
  JobQueueName: { Value: !Ref BatchQueue }
  ComputeEnvName: { Value: !GetAtt BatchCE.ComputeEnvironmentName }
