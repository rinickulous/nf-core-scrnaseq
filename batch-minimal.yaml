AWSTemplateFormatVersion: '2010-09-09'
Description: Minimal AWS Batch (EC2 Spot) for Nextflow tests with instance profile
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  InstanceTypesCsv:
    Type: String
    Default: "m6i.large,c6i.large,t3.large"
    Description: Comma-separated list of instance types
Resources:
  EcsInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecsInstanceRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  EcsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: ecsInstanceRole
      Roles: [ !Ref EcsInstanceRole ]
  BatchCE:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      ComputeEnvironmentName: nfcore-scrna-ce
      ComputeResources:
        Type: SPOT
        AllocationStrategy: SPOT_CAPACITY_OPTIMIZED
        MinvCpus: 0
        DesiredvCpus: 0
        MaxvCpus: 8
        InstanceRole: !GetAtt EcsInstanceProfile.Arn
        InstanceTypes: !Split [ ",", !Ref InstanceTypesCsv ]
        Subnets: !Ref SubnetIds
        SecurityGroupIds: [ !Ref SecurityGroupId ]
      State: ENABLED
  BatchQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: nfcore-scrna-queue
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref BatchCE
Outputs:
  JobQueueName:
    Value: !Ref BatchQueue
  ComputeEnvName:
    Value: !GetAtt BatchCE.ComputeEnvironmentName
  InstanceProfileArn:
    Value: !GetAtt EcsInstanceProfile.Arn
